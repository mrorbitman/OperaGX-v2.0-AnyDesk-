name: RustDesk Ubuntu GNOME

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RUSTDESK_PASS: Pass@4321
      RUNTIME_MINUTES: 350

    steps:
      - name: Update System & Install Core GNOME Desktop
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ubuntu-desktop-minimal \
            gnome-shell \
            gnome-session-flashback \
            xvfb \
            x11-xserver-utils \
            dbus-x11 \
            xauth \
            wget \
            curl

      - name: Install RustDesk
        run: |
          RUSTDESK_URL=$(curl -s https://api.github.com/repos/rustdesk/rustdesk/releases/latest | grep "browser_download_url.*x86_64.deb\|browser_download_url.*amd64.deb" | head -n 1 | cut -d : -f 2,3 | tr -d '" ')
          
          if [ -z "$RUSTDESK_URL" ]; then
            RUSTDESK_URL="https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.deb"
          fi
          
          wget "$RUSTDESK_URL" -O rustdesk.deb
          sudo dpkg -i rustdesk.deb || sudo apt-get install -f -y
          rm rustdesk.deb

      - name: Install Opera Browser
        run: |
          wget -qO- https://deb.opera.com/archive.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/opera.gpg
          echo "deb https://deb.opera.com/opera-stable/ stable non-free" | sudo tee /etc/apt/sources.list.d/opera-stable.list
          sudo apt-get update -y
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y opera-stable

      - name: Start Virtual Display & GNOME Session
        run: |
          # 1. Start Xvfb framebuffer on display :1
          Xvfb :1 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:1
          
          sleep 3
          
          # 2. Grant permissions
          xhost +local: || true
          
          # 3. Launch GNOME Flashback session
          export LIBGL_ALWAYS_SOFTWARE=1
          dbus-launch gnome-session --session=gnome-flashback &
          sleep 5

      - name: Configure RustDesk & Launch Display Server
        run: |
          export DISPLAY=:1
          
          # 1. Install & enable system service
          sudo rustdesk --service &
          sleep 2
          
          # 2. Set static unattended access password
          sudo rustdesk --password "${{ env.RUSTDESK_PASS }}"
          
          # 3. Force-launch the display server process inside DISPLAY=:1
          sudo DISPLAY=:1 rustdesk --server &
          sleep 5

      - name: Launch Opera Browser Session
        run: |
          export DISPLAY=:1
          opera https://create.roblox.com/landing --no-sandbox --no-first-run > /dev/null 2>&1 &
          sleep 5

      - name: Fetch and Display RustDesk ID
        run: |
          CLEAN_ID=""
          
          for i in {1..20}; do
            CLEAN_ID=$(sudo rustdesk --get-id 2>/dev/null | tr -d '[:space:]')
            if [ -n "$CLEAN_ID" ] && [[ "$CLEAN_ID" =~ ^[0-9]+$ ]]; then
              break
            fi
            sleep 3
          done

          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          RED='\033[0;31m'
          RESET='\033[0m'

          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${GREEN}        RUSTDESK CLOUD MACHINE IS READY             ${RESET}"
          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${YELLOW} CONNECTION ID : ${RED}${CLEAN_ID}${RESET}"
          echo -e "${YELLOW} PASSWORD      : ${RED}${{ env.RUSTDESK_PASS }}${RESET}"
          echo -e "${GREEN}====================================================${RESET}"

      - name: Keep alive
        run: |
          MINS="${{ env.RUNTIME_MINUTES }}"
          END_TIME=$(($(date +%s) + MINS * 60))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "Cloud PC Heartbeat $(date +'%H:%M:%S') | Active GNOME desktop session running..."
            sleep 60
          done
