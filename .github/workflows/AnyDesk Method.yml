name: AnyDesk Ubuntu Workstation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANYDESK_PASS: Pass@4321
      RUNTIME_MINUTES: 350

    steps:
      - name: Update System & Install XFCE Desktop
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xfce4 \
            xfce4-goodies \
            xvfb \
            x11-xserver-utils \
            dbus-x11 \
            wget \
            curl \
            libpolkit-gobject-1-0 \
            libpangox-1.0-0

      - name: Download & Install AnyDesk v6 (Wayland-Bypass Build)
        run: |
          # Downloading v6.3.2 DEB package directly to bypass broken v8 Wayland checks
          wget https://download.anydesk.com/linux/anydesk_6.3.2-1_amd64.deb -O anydesk.deb
          sudo dpkg -i anydesk.deb || sudo apt-get install -f -y
          rm anydesk.deb

      - name: Install Opera Browser
        run: |
          wget -qO- https://deb.opera.com/archive.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/opera.gpg
          echo "deb https://deb.opera.com/opera-stable/ stable non-free" | sudo tee /etc/apt/sources.list.d/opera-stable.list
          sudo apt-get update -y
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y opera-stable

      - name: Start Virtual Display & XFCE Session
        run: |
          # Start Xvfb on display :1
          Xvfb :1 -screen 0 1920x1080x24 +extension GLX +render -noreset &
          export DISPLAY=:1
          sleep 3
          
          # Grant display permissions
          xhost +local: || true
          
          # Launch XFCE Desktop Session
          dbus-launch startxfce4 &
          sleep 5

      - name: Configure AnyDesk Password & Launch Process
        run: |
          export DISPLAY=:1
          
          # Set password
          echo "${{ env.ANYDESK_PASS }}" | sudo anydesk --set-password
          
          # Launch AnyDesk bound directly to DISPLAY=:1
          sudo DISPLAY=:1 anydesk --service &
          sleep 5

      - name: Launch Opera Browser Session
        run: |
          export DISPLAY=:1
          opera https://create.roblox.com/landing --no-sandbox --no-first-run > /dev/null 2>&1 &
          sleep 5

      - name: Fetch and Display AnyDesk Connection Address
        run: |
          CLEAN_ID=""
          CONF_PATH="/etc/anydesk/system.conf"
          
          for i in {1..15}; do
            if [ -f "$CONF_PATH" ]; then
              CLEAN_ID=$(grep -oP 'ad\.anynet\.id=\K\d+' "$CONF_PATH" || true)
              if [ -n "$CLEAN_ID" ]; then
                break
              fi
            fi
            sleep 3
          done

          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          RED='\033[0;31m'
          RESET='\033[0m'

          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${GREEN}        ANYDESK CLOUD MACHINE IS READY TO CONNECT     ${RESET}"
          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${YELLOW} CONNECTION ID : ${RED}${CLEAN_ID}${RESET}"
          echo -e "${YELLOW} PASSWORD      : ${RED}${{ env.ANYDESK_PASS }}${RESET}"
          echo -e "${GREEN}====================================================${RESET}"

      - name: Keep alive
        run: |
          MINS="${{ env.RUNTIME_MINUTES }}"
          END_TIME=$(($(date +%s) + MINS * 60))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "Cloud PC Heartbeat $(date +'%H:%M:%S') | Active desktop session running..."
            sleep 60
          done
