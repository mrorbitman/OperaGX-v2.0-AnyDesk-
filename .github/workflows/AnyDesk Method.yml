name: AnyDesk

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      ANYDESK_PASS: ${{ secrets.ANYDESK_PASS }}
      RUNTIME_MINUTES: 350

    steps:

      # ------------------------------------------------------------
      # Clean unnecessary desktop shortcuts
      # ------------------------------------------------------------
      - name: Wipe Unnecessary Pre-Installed GitHub Apps & Shortcuts
        run: |
          Write-Host "Purging unnecessary desktop shortcuts..."

          $publicDesktop = [Environment]::GetFolderPath("CommonDesktopDirectory")
          $userDesktop = Join-Path $env:USERPROFILE "Desktop"

          $targets = @(
              "Unity Hub.lnk",
              "R 4.6.0.lnk",
              "Firefox.lnk",
              "Google Chrome.lnk",
              "Claim Rewards Here.lnk"
          )

          foreach ($target in $targets) {
              $publicPath = Join-Path $publicDesktop $target
              $userPath = Join-Path $userDesktop $target

              if (Test-Path $publicPath) {
                  Remove-Item $publicPath -Force -ErrorAction SilentlyContinue
                  Write-Host "Removed: $publicPath"
              }

              if (Test-Path $userPath) {
                  Remove-Item $userPath -Force -ErrorAction SilentlyContinue
                  Write-Host "Removed: $userPath"
              }
          }


      # ------------------------------------------------------------
      # Cloudflare WARP
      # ------------------------------------------------------------
      - name: Install Cloudflare WARP
        run: |
          Write-Host "Downloading Cloudflare WARP..."

          $warpUrl = "https://1111-releases.cloudflareclient.com/win/latest"
          $warpMsi = Join-Path $env:TEMP "Cloudflare_WARP.msi"

          Invoke-WebRequest `
              -Uri $warpUrl `
              -OutFile $warpMsi `
              -UserAgent "Mozilla/5.0"

          Write-Host "Installing Cloudflare WARP..."

          $process = Start-Process `
              -FilePath "msiexec.exe" `
              -ArgumentList "/i `"$warpMsi`" /qn /norestart" `
              -Wait `
              -PassThru

          Write-Host "MSI exit code: $($process.ExitCode)"

          Remove-Item $warpMsi -Force -ErrorAction SilentlyContinue

          $warpCli = "C:\Program Files\Cloudflare\Cloudflare WARP\warp-cli.exe"

          Write-Host "Waiting for WARP installation..."

          for ($i = 1; $i -le 15; $i++) {
              if (Test-Path $warpCli) {
                  Write-Host "WARP CLI found."
                  break
              }

              Start-Sleep -Seconds 2
          }

          if (-not (Test-Path $warpCli)) {
              Write-Warning "WARP CLI was not found. Continuing without WARP."
              exit 0
          }

          Write-Host "Registering WARP..."

          try {
              & $warpCli registration new | Out-Host
          }
          catch {
              Write-Warning "WARP registration command failed: $($_.Exception.Message)"
          }

          Write-Host "Setting WARP mode..."

          try {
              & $warpCli mode warp | Out-Host
          }
          catch {
              Write-Warning "Unable to set WARP mode: $($_.Exception.Message)"
          }

          Write-Host "Connecting WARP..."

          try {
              & $warpCli connect | Out-Host
          }
          catch {
              Write-Warning "Unable to connect WARP: $($_.Exception.Message)"
          }

          Start-Sleep -Seconds 8

          Write-Host "Checking public IP..."

          try {
              $ipInfo = Invoke-RestMethod `
                  -Uri "https://ipinfo.io/json" `
                  -TimeoutSec 15

              Write-Host "Public IP : $($ipInfo.ip)"
              Write-Host "City      : $($ipInfo.city)"
              Write-Host "Region    : $($ipInfo.region)"
              Write-Host "Country   : $($ipInfo.country)"
          }
          catch {
              Write-Warning "Unable to retrieve IP information."
          }


      # ------------------------------------------------------------
      # AnyDesk installation
      # ------------------------------------------------------------
      - name: Download and Install AnyDesk
        run: |
          Write-Host "Downloading AnyDesk..."

          $url = "https://download.anydesk.com/AnyDesk.exe"
          $dst = Join-Path $env