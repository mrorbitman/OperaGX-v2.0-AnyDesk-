name: TightVNC Desktop for AVNC App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vnc-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VNC_PASS: Pass@4321
      RUNTIME_MINUTES: 350

    steps:
      - name: Create 4GB Swap Space
        run: |
          sudo fallocate -l 4G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=4096
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2

      - name: Update System & Install XFCE4 + TightVNC + Bore
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xfce4 \
            xfce4-terminal \
            tightvncserver \
            dbus-x11 \
            xauth \
            wget \
            curl

          # Download Bore for raw TCP tunneling
          wget https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/
          rm bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz

      - name: Configure TightVNC Password & xstartup
        run: |
          mkdir -p ~/.vnc
          
          # Set VNC password
          echo "${{ env.VNC_PASS }}" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          # TightVNC XFCE Startup Script
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          xrdb $HOME/.Xresources
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          startxfce4 &
          EOF
          chmod +x ~/.vnc/xstartup

      - name: Start TightVNC Server on display :1 (Port 5901)
        run: |
          vncserver :1 -geometry 1280x720 -depth 24

      - name: Start Bore TCP Tunnel & Display AVNC Details
        run: |
          # Tunnel raw TCP Port 5901
          bore local 5901 --to bore.pub > /tmp/bore.log 2>&1 &
          sleep 5

          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          RED='\033[0;31m'
          RESET='\033[0m'

          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${GREEN}        AVNC / TIGHTVNC CONNECTION DETAILS          ${RESET}"
          echo -e "${GREEN}====================================================${RESET}"
          
          cat /tmp/bore.log
          
          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${YELLOW} VNC PASSWORD : ${RED}${{ env.VNC_PASS }}${RESET}"
          echo -e "${GREEN}====================================================${RESET}"

      - name: Keep alive
        run: |
          MINS="${{ env.RUNTIME_MINUTES }}"
          END_TIME=$(($(date +%s) + MINS * 60))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "Cloud PC Heartbeat $(date +'%H:%M:%S') | Active TightVNC session running..."
            sleep 60
          done
