name: AnyDesk Ubuntu GNOME

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANYDESK_PASS: Pass@4321
      RUNTIME_MINUTES: 350

    steps:
      - name: Update System & Install Core GNOME Desktop
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ubuntu-desktop-minimal \
            gnome-shell \
            gnome-session-flashback \
            xvfb \
            x11-xserver-utils \
            dbus-x11 \
            xauth \
            wget \
            curl

      - name: Install AnyDesk
        run: |
          wget -qO - https://keys.anydesk.com/repos/DEB-GPG-KEY | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/anydesk.gpg
          echo "deb http://deb.anydesk.com/ all main" | sudo tee /etc/apt/sources.list.d/anydesk.list
          sudo apt-get update -y
          sudo apt-get install -y anydesk

      - name: Install Opera Browser
        run: |
          wget -qO- https://deb.opera.com/archive.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/opera.gpg
          echo "deb https://deb.opera.com/opera-stable/ stable non-free" | sudo tee /etc/apt/sources.list.d/opera-stable.list
          sudo apt-get update -y
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y opera-stable

      - name: Start Display Server & GNOME Desktop
        run: |
          # 1. Start Xvfb virtual framebuffer on display :1
          Xvfb :1 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:1
          
          sleep 3
          
          # 2. Allow local connections to X11
          xhost +local: || true
          
          # 3. Launch GNOME desktop in fallback mode for software rendering
          export LIBGL_ALWAYS_SOFTWARE=1
          dbus-launch gnome-session --session=gnome-flashback &
          sleep 5

      - name: Configure AnyDesk Password & Direct Process Launch
        run: |
          export DISPLAY=:1
          
          # Set unattended access password
          echo "${{ env.ANYDESK_PASS }}" | sudo anydesk --set-password
          
          # Bypass broken systemd daemon: launch AnyDesk explicitly tied to DISPLAY=:1
          sudo DISPLAY=:1 anydesk --tray &
          sleep 5

      - name: Launch Opera Browser Session
        run: |
          export DISPLAY=:1
          opera https://create.roblox.com/landing --no-sandbox --no-first-run > /dev/null 2>&1 &
          sleep 5

      - name: Fetch and Display AnyDesk Connection Address
        run: |
          CLEAN_ID=""
          CONF_PATH="/etc/anydesk/system.conf"
          
          for i in {1..15}; do
            if [ -f "$CONF_PATH" ]; then
              CLEAN_ID=$(grep -oP 'ad\.anynet\.id=\K\d+' "$CONF_PATH" || true)
              if [ -n "$CLEAN_ID" ]; then
                break
              fi
            fi
            sleep 3
          done

          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          RED='\033[0;31m'
          RESET='\033[0m'

          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${GREEN}        ANYDESK CLOUD MACHINE IS READY TO CONNECT     ${RESET}"
          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${YELLOW} CONNECTION ID : ${RED}${CLEAN_ID}${RESET}"
          echo -e "${YELLOW} PASSWORD      : ${RED}${{ env.ANYDESK_PASS }}${RESET}"
          echo -e "${GREEN}====================================================${RESET}"

      - name: Keep alive
        run: |
          MINS="${{ env.RUNTIME_MINUTES }}"
          END_TIME=$(($(date +%s) + MINS * 60))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "Cloud PC Heartbeat $(date +'%H:%M:%S') | Running active Linux desktop session..."
            sleep 60
          done
