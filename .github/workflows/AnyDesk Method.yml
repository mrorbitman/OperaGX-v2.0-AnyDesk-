name: AnyDesk macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-mac:
    runs-on: macos-14
    timeout-minutes: 360

    env:
      ANYDESK_PASS: "Pass@4321"
      RUNTIME_MINUTES: 350

    steps:

      - name: Clean Desktop
        shell: bash
        run: |
          echo "Cleaning unnecessary desktop shortcuts..."

          rm -f "$HOME/Desktop/Unity Hub.app"
          rm -f "$HOME/Desktop/Firefox.app"
          rm -f "$HOME/Desktop/Google Chrome.app"

      - name: Download AnyDesk
        shell: bash
        run: |
          set -e

          echo "Downloading AnyDesk..."

          curl -L \
            "https://download.anydesk.com/anydesk.dmg" \
            -o "$RUNNER_TEMP/anydesk.dmg"

          echo "Mounting DMG..."

          hdiutil attach "$RUNNER_TEMP/AnyDesk.dmg" \
            -nobrowse \
            -mountpoint "$RUNNER_TEMP/anydesk"

      - name: Install AnyDesk
        shell: bash
        run: |
          set -e

          echo "Installing AnyDesk..."

          if [ -d "$RUNNER_TEMP/anydesk/AnyDesk.app" ]; then
            sudo cp -R \
              "$RUNNER_TEMP/anydesk/AnyDesk.app" \
              "/Applications/AnyDesk.app"
          else
            echo "AnyDesk.app was not found in the mounted image."
            exit 1
          fi

          hdiutil detach "$RUNNER_TEMP/anydesk" || true

          rm -f "$RUNNER_TEMP/AnyDesk.dmg"

          echo "AnyDesk installed."

            - name: Start AnyDesk Service
        shell: bash
        run: |
          set -e

          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          echo "AnyDesk executable:"
          ls -l "$ANYDESK"

          echo ""
          echo "Starting AnyDesk..."

          open -a "/Applications/AnyDesk.app"

          echo "Waiting for AnyDesk processes..."

          for i in {1..30}; do
            if pgrep -if "AnyDesk" >/dev/null; then
              echo "AnyDesk process detected on attempt $i."
              break
            fi

            echo "Waiting... $i/30"
            sleep 5
          done

          echo ""
          echo "Running AnyDesk processes:"
          pgrep -alf "AnyDesk" || true

          echo ""
          echo "Trying AnyDesk ID..."

          ID=""

          for i in {1..20}; do
            ID=$("$ANYDESK" --get-id 2>/dev/null || true)

            if [ -n "$ID" ]; then
              echo "AnyDesk ID: $ID"
              break
            fi

            echo "ID unavailable... $i/20"
            sleep 5
          done

          if [ -z "$ID" ]; then
            echo "AnyDesk ID could not be obtained."
            echo "The AnyDesk service is probably not running on this runner."
            exit 1
          fi

      - name: Configure AnyDesk Password
        shell: bash
        run: |
          set -e

          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          echo "Configuring unattended access..."

          RESULT=$(printf '%s\n' "$ANYDESK_PASS" | \
            sudo "$ANYDESK" --set-password 2>&1) || {
              echo "AnyDesk password configuration failed."
              echo "$RESULT"
              exit 1
            }

          echo "$RESULT"

          echo "AnyDesk unattended access configured."

      - name: Display AnyDesk Information
        shell: bash
        run: |
          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          ID=$("$ANYDESK" --get-id 2>/dev/null || true)

          echo ""
          echo "===================================================="
          echo "             ANYDESK MAC READY"
          echo "===================================================="
          echo " CONNECTION ID : $ID"
          echo " PASSWORD      : $ANYDESK_PASS"
          echo "===================================================="

      - name: Grant macOS Remote Permissions
        shell: bash
        run: |
          echo "Checking macOS permissions..."

          echo ""
          echo "IMPORTANT:"
          echo "macOS may require Screen Recording and Accessibility"
          echo "permissions for AnyDesk."
          echo ""

          # GitHub-hosted macOS runners may not allow these
          # permissions to be granted automatically.
          #
          # AnyDesk itself may therefore connect with limited
          # interaction depending on the runner image.

      - name: Get AnyDesk ID
        shell: bash
        run: |
          set -e

          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          echo "Waiting for AnyDesk ID..."

          ID=""

          for i in {1..15}; do
            ID=$("$ANYDESK" --get-id 2>/dev/null || true)

            if [ -n "$ID" ]; then
              break
            fi

            sleep 4
          done

          echo ""
          echo "===================================================="
          echo "          ANYDESK MAC CLOUD MACHINE READY"
          echo "===================================================="
          echo " CONNECTION ID : $ID"
          echo " PASSWORD      : $ANYDESK_PASS"
          echo "===================================================="
          echo ""

          if [ -z "$ID" ]; then
            echo "WARNING: AnyDesk ID could not be detected."
          fi

      - name: Install Opera GX
        shell: bash
        run: |
          set -e

          echo "Installing Opera GX..."

          brew install --cask opera-gx || true

          echo "Opera GX installation complete."

      - name: Launch Roblox Creator
        shell: bash
        run: |
          echo "Launching Roblox Creator..."

          open -a "Opera GX" \
            "https://create.roblox.com/landing"

          sleep 5

      - name: Show Machine Information
        shell: bash
        run: |
          echo ""
          echo "================ MACHINE INFO ================"

          echo "macOS:"
          sw_vers

          echo ""
          echo "CPU:"
          sysctl -n hw.logicalcpu

          echo ""
          echo "Memory:"
          sysctl -n hw.memsize

          echo ""
          echo "=============================================="

      - name: Keep Alive
        shell: bash
        run: |
          MINUTES="$RUNTIME_MINUTES"

          END_TIME=$(date -v+"${MINUTES}"M)

          echo "Cloud Mac will remain active until:"
          echo "$END_TIME"

          while true; do
            NOW=$(date)

            echo "Cloud Mac Heartbeat: $NOW"

            if [[ "$OSTYPE" == "darwin"* ]]; then
              CURRENT=$(date +%s)
              END=$(date -j -f "%a %b %d %T %Z %Y" \
                "$END_TIME" +%s 2>/dev/null || echo 0)

              if [ "$END" -ne 0 ] && [ "$CURRENT" -ge "$END" ]; then
                break
              fi
            fi

            sleep 60
          done

          echo "Runtime finished."