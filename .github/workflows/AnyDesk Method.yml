name: XFCE4 VNC via Pinggy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vnc-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VNC_PASS: Pass@4321
      RUNTIME_MINUTES: 350

    steps:
      - name: Create 4GB Swap Space (Prevents OOM Kills)
        run: |
          sudo fallocate -l 4G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=4096
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2

      - name: Update System & Install XFCE4 Desktop + Themes + VNC
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xfce4 \
            xfce4-goodies \
            xfce4-terminal \
            shimmer-themes \
            papirus-icon-theme \
            adwaita-icon-theme-full \
            gtk2-engines-pixbuf \
            tightvncserver \
            xfonts-base \
            dbus-x11 \
            xauth \
            wget \
            curl \
            openssh-client

      - name: Configure VNC Password, XFCE4 Themes, and xstartup Script
        run: |
          mkdir -p ~/.vnc ~/.config/xfce4/xfconf/xfce-perchannel-xml
          touch ~/.Xauthority
          
          # Set VNC password
          echo "${{ env.VNC_PASS }}" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # Apply Greybird Theme + Papirus Icons to XFCE Settings
          cat << 'EOF' > ~/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xsettings" version="1.0">
            <property name="Net" type="empty">
              <property name="ThemeName" type="string" value="Greybird"/>
              <property name="IconThemeName" type="string" value="Papirus"/>
            </property>
          </channel>
          EOF

          # Apply Greybird Theme to Window Borders
          cat << 'EOF' > ~/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfwm4" version="1.0">
            <property name="general" type="empty">
              <property name="theme" type="string" value="Greybird"/>
            </property>
          </channel>
          EOF

          # Configure VNC startup script to launch XFCE session
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_SESSION_TYPE=x11
          export GDK_BACKEND=x11
          export LIBGL_ALWAYS_SOFTWARE=1
          
          dbus-launch startxfce4 &
          EOF
          chmod +x ~/.vnc/xstartup

      - name: Start VNC Server
        run: |
          vncserver :1 -geometry 1920x1080 -depth 24

      - name: Launch Default Browser inside VNC
        run: |
          export DISPLAY=:1
          x-www-browser https://create.roblox.com/landing > /dev/null 2>&1 &
          sleep 3

      - name: Start Pinggy TCP Tunnel & Display URL
        run: |
          ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:5901 tcp@free.pinggy.io > /tmp/pinggy.log 2>&1 &
          sleep 8

          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          RED='\033[0;31m'
          RESET='\033[0m'

          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${GREEN}          XFCE4 VNC SERVER IS READY TO CONNECT       ${RESET}"
          echo -e "${GREEN}====================================================${RESET}"
          
          cat /tmp/pinggy.log
          
          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${YELLOW} VNC PASSWORD : ${RED}${{ env.VNC_PASS }}${RESET}"
          echo -e "${GREEN}====================================================${RESET}"

      - name: Keep alive
        run: |
          MINS="${{ env.RUNTIME_MINUTES }}"
          END_TIME=$(($(date +%s) + MINS * 60))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "Cloud PC Heartbeat $(date +'%H:%M:%S') | Active XFCE4 VNC session running..."
            sleep 60
          done
