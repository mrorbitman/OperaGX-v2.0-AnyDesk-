name: AnyDesk macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-mac:
    runs-on: macos-14
    timeout-minutes: 360

    env:
      ANYDESK_PASS: "Pass@4321"
      RUNTIME_MINUTES: 350

    steps:

      - name: Clean Desktop
        shell: bash
        run: |
          echo "Cleaning unnecessary desktop shortcuts..."

          rm -f "$HOME/Desktop/Unity Hub.app"
          rm -f "$HOME/Desktop/Firefox.app"
          rm -f "$HOME/Desktop/Google Chrome.app"

      - name: Download AnyDesk
        shell: bash
        run: |
          set -e

          echo "Downloading AnyDesk..."

          curl -L \
            "https://download.anydesk.com/anydesk.dmg" \
            -o "$RUNNER_TEMP/anydesk.dmg"

          echo "Mounting DMG..."

          hdiutil attach "$RUNNER_TEMP/AnyDesk.dmg" \
            -nobrowse \
            -mountpoint "$RUNNER_TEMP/anydesk"

      - name: Install AnyDesk
        shell: bash
        run: |
          set -e

          echo "Installing AnyDesk..."

          if [ -d "$RUNNER_TEMP/anydesk/AnyDesk.app" ]; then
            sudo cp -R \
              "$RUNNER_TEMP/anydesk/AnyDesk.app" \
              "/Applications/AnyDesk.app"
          else
            echo "AnyDesk.app was not found in the mounted image."
            exit 1
          fi

          hdiutil detach "$RUNNER_TEMP/anydesk" || true

          rm -f "$RUNNER_TEMP/AnyDesk.dmg"

          echo "AnyDesk installed."

                 - name: Configure AnyDesk
        shell: bash
        run: |
          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          echo "=== AnyDesk diagnostic ==="

          if [ ! -f "$ANYDESK" ]; then
            echo "ERROR: AnyDesk executable not found:"
            echo "$ANYDESK"
            exit 1
          fi

          echo "AnyDesk executable found."

          echo ""
          echo "Starting AnyDesk..."
          open -a "/Applications/AnyDesk.app"

          echo ""
          echo "Waiting for AnyDesk service..."
          
          ID=""

          for i in {1..60}; do
            echo "Attempt $i/60..."

            OUTPUT=$("$ANYDESK" --get-id 2>&1)
            RESULT=$?

            echo "Exit code: $RESULT"

            if [ "$RESULT" -eq 0 ]; then
              ID=$(echo "$OUTPUT" | tr -d '[:space:]')

              if [ -n "$ID" ]; then
                echo "AnyDesk ID detected: $ID"
                break
              fi
            else
              echo "AnyDesk has not responded yet."
              echo "$OUTPUT"
            fi

            sleep 2
          done

          if [ -z "$ID" ]; then
            echo ""
            echo "ERROR: AnyDesk never became ready."
            echo ""
            echo "=== Running AnyDesk processes ==="
            ps aux | grep -i '[A]nyDesk' || true

            echo ""
            echo "=== AnyDesk files ==="
            ls -la "/Applications/AnyDesk.app/Contents/MacOS/" || true

            exit 1
          fi

          echo ""
          echo "AnyDesk service is responding."
          echo "Waiting 5 seconds before configuring password..."
          sleep 5

          echo ""
          echo "=== Configuring unattended access ==="

          PASSWORD_RESULT=$(printf '%s\n' "$ANYDESK_PASS" | \
            "$ANYDESK" --set-password 2>&1)

          PASSWORD_EXIT=$?

          echo "Password command exit code: $PASSWORD_EXIT"
          echo "$PASSWORD_RESULT"

          if [ "$PASSWORD_EXIT" -ne 0 ]; then
            echo ""
            echo "ERROR: AnyDesk rejected the password configuration."
            echo "The service was reachable, so this is not a startup timeout."
            exit 1
          fi

          echo ""
          echo "Password configured successfully."

          echo ""
          echo "Restarting AnyDesk..."

          pkill -f "/Applications/AnyDesk.app/Contents/MacOS/AnyDesk" || true

          sleep 5

          open -a "/Applications/AnyDesk.app"

          echo "Waiting for AnyDesk to restart..."
          sleep 10

          echo ""
          echo "=== Final AnyDesk ID check ==="

          FINAL_ID=$("$ANYDESK" --get-id 2>&1)
          FINAL_EXIT=$?

          echo "Exit code: $FINAL_EXIT"
          echo "ID: $FINAL_ID"

          echo ""
          echo "AnyDesk configuration step finished."

      - name: Get AnyDesk ID
        shell: bash
        run: |
          set -e

          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          echo "Waiting for AnyDesk ID..."

          ID=""

          for i in {1..15}; do
            ID=$("$ANYDESK" --get-id 2>/dev/null || true)

            if [ -n "$ID" ]; then
              break
            fi

            sleep 4
          done

          echo ""
          echo "===================================================="
          echo "          ANYDESK MAC CLOUD MACHINE READY"
          echo "===================================================="
          echo " CONNECTION ID : $ID"
          echo " PASSWORD      : $ANYDESK_PASS"
          echo "===================================================="
          echo ""

          if [ -z "$ID" ]; then
            echo "WARNING: AnyDesk ID could not be detected."
          fi

      - name: Install Opera GX
        shell: bash
        run: |
          set -e

          echo "Installing Opera GX..."

          brew install --cask opera-gx || true

          echo "Opera GX installation complete."

      - name: Launch Roblox Creator
        shell: bash
        run: |
          echo "Launching Roblox Creator..."

          open -a "Opera GX" \
            "https://create.roblox.com/landing"

          sleep 5

      - name: Show Machine Information
        shell: bash
        run: |
          echo ""
          echo "================ MACHINE INFO ================"

          echo "macOS:"
          sw_vers

          echo ""
          echo "CPU:"
          sysctl -n hw.logicalcpu

          echo ""
          echo "Memory:"
          sysctl -n hw.memsize

          echo ""
          echo "=============================================="

      - name: Keep Alive
        shell: bash
        run: |
          MINUTES="$RUNTIME_MINUTES"

          END_TIME=$(date -v+"${MINUTES}"M)

          echo "Cloud Mac will remain active until:"
          echo "$END_TIME"

          while true; do
            NOW=$(date)

            echo "Cloud Mac Heartbeat: $NOW"

            if [[ "$OSTYPE" == "darwin"* ]]; then
              CURRENT=$(date +%s)
              END=$(date -j -f "%a %b %d %T %Z %Y" \
                "$END_TIME" +%s 2>/dev/null || echo 0)

              if [ "$END" -ne 0 ] && [ "$CURRENT" -ge "$END" ]; then
                break
              fi
            fi

            sleep 60
          done

          echo "Runtime finished."