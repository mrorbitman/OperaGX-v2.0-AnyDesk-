name: AnyDesk (macOS)

# Triggers manually and automatically on any branch push/PR to fix the UI visibility issue
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rdp:
    runs-on: macos-14
    timeout-minutes: 360
    env:
      ANYDESK_PASS: Pass@4321
      RUNTIME_MINUTES: 350

    steps:
      - name: Clean Non-Essential Desktop Shortcuts & Pre-installed Tools
        run: |
          echo "Purging unnecessary desktop shortcuts..."
          rm -rf ~/Desktop/*
          rm -rf /Users/Shared/Desktop/*

      - name: Download and Install AnyDesk
        run: |
          echo "Downloading AnyDesk for macOS..."
          curl -L -o /tmp/AnyDesk.dmg "https://download.anydesk.com/anydesk.dmg"
          
          echo "Mounting DMG and installing..."
          hdiutil attach /tmp/AnyDesk.dmg -nobrowse -mountpoint /Volumes/AnyDesk
          sudo cp -R "/Volumes/AnyDesk/AnyDesk.app" /Applications/
          hdiutil detach /Volumes/AnyDesk
          rm -f /tmp/AnyDesk.dmg

      - name: Configure Unattended Access Password
        run: |
          AD_BIN="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"
          
          # Set password for unattended access
          echo "${{ env.ANYDESK_PASS }}" | sudo "$AD_BIN" --set-password
          
          # Start AnyDesk background service daemon
          sudo "$AD_BIN" --service &
          sleep 5

      - name: Download and Install Opera GX
        run: |
          echo "Installing Opera GX via Homebrew..."
          brew install --cask opera-gx || true

          OPERA_APP="/Applications/Opera GX.app/Contents/MacOS/Opera GX"
          
          # Initialize workspace profile directory
          if [ -x "$OPERA_APP" ]; then
            echo "Launching clean engine layer..."
            "$OPERA_APP" --no-first-run &
            PID=$!
            sleep 10
            kill -9 $PID 2>/dev/null || true
          fi

          PROFILE_DIR="$HOME/Library/Application Support/com.operasoftware.OperaGX/Default"
          PREF_PATH="$PROFILE_DIR/Preferences"
          BACKUP_PATH="$PROFILE_DIR/Preferences.backup"

          mkdir -p "$PROFILE_DIR"

          if [ -f "$PREF_PATH" ]; then
            echo "Merging UI settings into Preferences..."
            python3 -c "
import json, os

path = os.path.expanduser('$PREF_PATH')
try:
    with open(path, 'r') as f:
        data = json.load(f)
except Exception:
    data = {}

ui = data.setdefault('ui', {})
browser = ui.setdefault('browser', {})
sidebar = browser.setdefault('sidebar', {})
sidebar['item_prefs'] = {'visibility': {'GxRewards': True}}
sidebar['GxRewards'] = {
    'last_action_time': '13426206569601273',
    'last_used_ts': '13426206569603970',
    'notification_type': '1'
}
ui['visibility'] = {'GxRewards': True}

with open(path, 'w') as f:
    json.dump(data, f, separators=(',', ':'))
"
            cp "$PREF_PATH" "$BACKUP_PATH"
          fi

          # Purge execution environment variables
          echo "Purging environment identifiers..."
          unset GITHUB_ACTIONS GITHUB_RUN_ID GITHUB_REPOSITORY GITHUB_ACTOR RUNNER_NAME RUNNER_TRACKER

          # Launch Opera GX with stealth flags
          TARGET_URL="https://create.roblox.com/landing"
          if [ -x "$OPERA_APP" ]; then
            "$OPERA_APP" "$TARGET_URL" --no-first-run --disable-blink-features=AutomationControlled --disable-infobars --password-store=basic &
          fi

      - name: Fetch and Display AnyDesk Connection Address
        run: |
          CONF_PATHS=("/etc/anydesk/system.conf" "$HOME/.anydesk/user.conf" "/Library/Preferences/anydesk/system.conf")
          CLEAN_ID=""

          for i in {1..15}; do
            for path in "${CONF_PATHS[@]}"; do
              if [ -f "$path" ]; then
                CLEAN_ID=$(grep -E 'ad\.anynet\.id=[0-9]+' "$path" | cut -d'=' -f2 | tr -d '\r\n')
                if [ -n "$CLEAN_ID" ]; then
                  break 2
                fi
              fi
            done
            sleep 4
          done

          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          RED='\033[0;31m'
          NC='\033[0m'

          echo -e "${GREEN}====================================================${NC}"
          echo -e "${GREEN}        ANYDESK CLOUD MACHINE IS READY TO CONNECT     ${NC}"
          echo -e "${GREEN}====================================================${NC}"
          echo -e "${YELLOW} CONNECTION ID : ${RED}${CLEAN_ID:-"ID not generated - check service logs"}${NC}"
          echo -e "${YELLOW} PASSWORD      : ${RED}${{ env.ANYDESK_PASS }}${NC}"
          echo -e "${GREEN}====================================================${NC}"

      - name: Keep alive
        run: |
          MINS=${{ env.RUNTIME_MINUTES }}
          END_TIME=$(($(date +%s) + MINS * 60))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            NOW=$(date +"%H:%M:%S")
            TARGET=$(date -r $END_TIME +"%H:%M:%S" 2>/dev/null || date -d @$END_TIME +"%H:%M:%S")
            echo "Cloud PC Heartbeat $NOW | Active until $TARGET"
            sleep 60
          done
