name: RustDesk Ubuntu Cloud PC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RUSTDESK_PASS: Pass@4321
      RUNTIME_MINUTES: 350

    steps:
      - name: Create 4GB Swap Space (Prevents OOM Kills)
        run: |
          sudo fallocate -l 4G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=4096
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2

      - name: Update System & Install XFCE Desktop
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xfce4 \
            xfce4-terminal \
            xvfb \
            x11-xserver-utils \
            dbus-x11 \
            xauth \
            wget \
            curl

      - name: Install RustDesk
        run: |
          RUSTDESK_URL=$(curl -s https://api.github.com/repos/rustdesk/rustdesk/releases/latest | grep "browser_download_url.*x86_64.deb\|browser_download_url.*amd64.deb" | head -n 1 | cut -d : -f 2,3 | tr -d '" ')
          if [ -z "$RUSTDESK_URL" ]; then
            RUSTDESK_URL="https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.deb"
          fi
          wget "$RUSTDESK_URL" -O rustdesk.deb
          sudo dpkg -i rustdesk.deb || sudo apt-get install -f -y
          rm rustdesk.deb

      - name: Install Opera Browser
        run: |
          wget -qO- https://deb.opera.com/archive.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/opera.gpg
          echo "deb https://deb.opera.com/opera-stable/ stable non-free" | sudo tee /etc/apt/sources.list.d/opera-stable.list
          sudo apt-get update -y
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y opera-stable

      - name: Start Xvfb & XFCE4 Session
        run: |
          # 1. Start virtual framebuffer
          Xvfb :1 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:1
          sleep 3
          
          xhost +local: || true
          
          # 2. Start Lightweight Desktop Session
          dbus-launch startxfce4 &
          sleep 5

      - name: Configure and Launch RustDesk Service
        run: |
          export DISPLAY=:1
          export XDG_SESSION_TYPE=x11
          
          # Set static unattended access password
          sudo rustdesk --password "${{ env.RUSTDESK_PASS }}"
          
          # Enable and start rustdesk background service bound to X11 display
          sudo DISPLAY=:1 XDG_SESSION_TYPE=x11 rustdesk --service &
          sleep 5

      - name: Launch Opera Browser Session
        run: |
          export DISPLAY=:1
          opera https://create.roblox.com/landing --no-sandbox --no-first-run > /dev/null 2>&1 &
          sleep 3

      - name: Fetch RustDesk ID
        run: |
          CLEAN_ID=""
          for i in {1..20}; do
            CLEAN_ID=$(sudo rustdesk --get-id 2>/dev/null | tr -d '[:space:]')
            if [ -n "$CLEAN_ID" ] && [[ "$CLEAN_ID" =~ ^[0-9]+$ ]]; then
              break
            fi
            sleep 3
          done

          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          RED='\033[0;31m'
          RESET='\033[0m'

          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${GREEN}        RUSTDESK CLOUD MACHINE IS READY             ${RESET}"
          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${YELLOW} CONNECTION ID : ${RED}${CLEAN_ID}${RESET}"
          echo -e "${YELLOW} PASSWORD      : ${RED}${{ env.RUSTDESK_PASS }}${RESET}"
          echo -e "${GREEN}====================================================${RESET}"

      - name: Keep alive
        run: |
          MINS="${{ env.RUNTIME_MINUTES }}"
          END_TIME=$(($(date +%s) + MINS * 60))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "Cloud PC Heartbeat $(date +'%H:%M:%S') | Active XFCE session running..."
            sleep 60
          done
