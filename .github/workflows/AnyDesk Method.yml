name: AnyDesk Ubuntu GNOME

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANYDESK_PASS: Pass@4321
      RUNTIME_MINUTES: 350

    steps:
      - name: Create 4GB Swap Space (Prevents OOM Kills)
        run: |
          sudo fallocate -l 4G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=4096
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2

      - name: Update System & Install Core GNOME Desktop
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ubuntu-desktop-minimal \
            gnome-shell \
            gnome-session-flashback \
            xvfb \
            x11-xserver-utils \
            dbus-x11 \
            xauth \
            wget \
            curl \
            libpolkit-gobject-1-0 \
            libgtkglext1 \
            libminizip1

      - name: Install Legacy libpangox-1.0-0 Workaround
        run: |
          # Fetch and install missing libpangox binary for Ubuntu 24.04
          wget http://ftp.us.debian.org/debian/pool/main/p/pangox-compat/libpangox-1.0-0_0.0.2-5.1_amd64.deb -O libpangox.deb
          sudo dpkg -i libpangox.deb || sudo apt-get install -f -y
          rm libpangox.deb

      - name: Install Official AnyDesk via APT Repo
        run: |
          wget -qO- https://keys.anydesk.com/repos/DEB-GPG-KEY | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/anydesk.gpg
          echo "deb http://deb.anydesk.com/ all main" | sudo tee /etc/apt/sources.list.d/anydesk-stable.list
          sudo apt-get update -y
          sudo apt-get install -y anydesk

      - name: Start Virtual Display & GNOME Session
        run: |
          # 1. Start Xvfb framebuffer on display :1
          Xvfb :1 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:1
          sleep 3
          
          # 2. Allow connections to X11 display
          xhost +local: || true
          
          # 3. Launch GNOME session with software GL rendering
          export LIBGL_ALWAYS_SOFTWARE=1
          dbus-launch gnome-session --session=gnome-flashback > /dev/null 2>&1 &
          sleep 5

      - name: Configure AnyDesk Password & Launch Desktop Session
        run: |
          export DISPLAY=:1
          
          # 1. Set unattended access password
          echo "${{ env.ANYDESK_PASS }}" | sudo anydesk --set-password
          
          # 2. Start AnyDesk service
          sudo service anydesk start || sudo anydesk --service &
          sleep 3
          
          # 3. Spawn UI listener directly on DISPLAY=:1
          anydesk --tray > /dev/null 2>&1 &
          sleep 5

      - name: Launch Pre-installed Default Browser
        run: |
          export DISPLAY=:1
          # Opens the URL using the system's default pre-installed browser (x-www-browser / firefox)
          x-www-browser https://create.roblox.com/landing > /dev/null 2>&1 &
          sleep 3

      - name: Fetch and Display AnyDesk Connection Address
        run: |
          CLEAN_ID=""
          
          for i in {1..20}; do
            CLEAN_ID=$(anydesk --get-id 2>/dev/null | tr -d '[:space:]')
            if [ -z "$CLEAN_ID" ] && [ -f "/etc/anydesk/system.conf" ]; then
              CLEAN_ID=$(grep -oP 'ad\.anynet\.id=\K\d+' /etc/anydesk/system.conf || true)
            fi
            
            if [ -n "$CLEAN_ID" ] && [[ "$CLEAN_ID" =~ ^[0-9]+$ ]]; then
              break
            fi
            sleep 3
          done

          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          RED='\033[0;31m'
          RESET='\033[0m'

          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${GREEN}        ANYDESK CLOUD MACHINE IS READY TO CONNECT     ${RESET}"
          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${YELLOW} CONNECTION ID : ${RED}${CLEAN_ID}${RESET}"
          echo -e "${YELLOW} PASSWORD      : ${RED}${{ env.ANYDESK_PASS }}${RESET}"
          echo -e "${GREEN}====================================================${RESET}"

      - name: Keep alive
        run: |
          MINS="${{ env.RUNTIME_MINUTES }}"
          END_TIME=$(($(date +%s) + MINS * 60))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "Cloud PC Heartbeat $(date +'%H:%M:%S') | Active GNOME desktop session running..."
            sleep 60
          done
