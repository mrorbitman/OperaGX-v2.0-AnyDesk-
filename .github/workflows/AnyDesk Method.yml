name: AnyDesk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 360

    env:
      ANYDESK_PASS: "Pass@4321"
      RUNTIME_MINUTES: "350"

    steps:

      # ==================================================
      # CLEAN DESKTOP
      # ==================================================

      - name: Clean Desktop
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning desktop..."

          rm -f "$HOME/Desktop/Unity Hub.app" || true
          rm -f "$HOME/Desktop/Firefox.app" || true
          rm -f "$HOME/Desktop/Google Chrome.app" || true

      # ==================================================
      # DOWNLOAD ANYDESK
      # ==================================================

      - name: Download AnyDesk
        shell: bash
        run: |
          set -euo pipefail

          DOWNLOAD="$RUNNER_TEMP/AnyDesk.download"
          DMG="$RUNNER_TEMP/AnyDesk.dmg"

          echo "Downloading AnyDesk macOS..."

          curl -fL \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            -A "Mozilla/5.0" \
            "https://anydesk.com/en/downloads/thank-you?dv=mac_dmg" \
            -o "$DOWNLOAD"

          echo ""
          echo "Downloaded file:"
          ls -lh "$DOWNLOAD"

          echo ""
          echo "Initial file type:"
          file "$DOWNLOAD"

          # ------------------------------------------------
          # First attempt: file may already be a DMG
          # ------------------------------------------------

          if file "$DOWNLOAD" | grep -Eqi \
            'disk image|hfs|filesystem|Apple Partition Map|GUID Partition Table'; then

            echo "Download is already a disk image."

            cp "$DOWNLOAD" "$DMG"

          else

            echo "Download is not directly recognized as a DMG."
            echo "Attempting zlib decompression..."

            python3 - "$DOWNLOAD" "$DMG" <<'PY'
import sys
import zlib
import gzip

src = sys.argv[1]
dst = sys.argv[2]

with open(src, "rb") as f:
    data = f.read()

output = None

# Try normal zlib stream
try:
    obj = zlib.decompressobj()
    result = obj.decompress(data) + obj.flush()

    if result:
        output = result
        print("Successfully decompressed using zlib.")
except Exception as e:
    print("Normal zlib decompression failed:", e)

# Try raw DEFLATE
if output is None:
    try:
        obj = zlib.decompressobj(-zlib.MAX_WBITS)
        result = obj.decompress(data) + obj.flush()

        if result:
            output = result
            print("Successfully decompressed using raw DEFLATE.")
    except Exception as e:
        print("Raw DEFLATE decompression failed:", e)

# Try gzip
if output is None:
    try:
        output = gzip.decompress(data)
        print("Successfully decompressed using gzip.")
    except Exception as e:
        print("Gzip decompression failed:", e)

if output is None:
    print()
    print("ERROR: Could not decompress the AnyDesk download.")
    print("The server response may require browser-side processing.")
    sys.exit(1)

with open(dst, "wb") as f:
    f.write(output)

print(f"Input : {len(data):,} bytes")
print(f"Output: {len(output):,} bytes")
PY

          fi

          echo ""
          echo "Final DMG:"
          ls -lh "$DMG"

          echo ""
          echo "Final file type:"
          file "$DMG"

          # ------------------------------------------------
          # Validate disk image before hdiutil
          # ------------------------------------------------

          if ! file "$DMG" | grep -Eqi \
            'disk image|hfs|filesystem|Apple Partition Map|GUID Partition Table'; then

            echo ""
            echo "ERROR: The resulting file is still not recognized as a DMG."
            echo ""
            echo "First 64 bytes:"
            xxd -l 64 "$DMG" || true
            echo ""

            exit 1
          fi

          echo ""
          echo "AnyDesk DMG validation passed."

      # ==================================================
      # MOUNT DMG
      # ==================================================

      - name: Mount AnyDesk DMG
        shell: bash
        run: |
          set -euo pipefail

          DMG="$RUNNER_TEMP/AnyDesk.dmg"
          MOUNT="$RUNNER_TEMP/anydesk"

          mkdir -p "$MOUNT"

          echo "Mounting AnyDesk..."

          hdiutil attach "$DMG" \
            -nobrowse \
            -readonly \
            -mountpoint "$MOUNT"

          echo ""
          echo "DMG mounted successfully."
          echo ""

          ls -la "$MOUNT"

      # ==================================================
      # INSTALL ANYDESK
      # ==================================================

      - name: Install AnyDesk
        shell: bash
        run: |
          set -euo pipefail

          MOUNT="$RUNNER_TEMP/anydesk"

          echo "Searching for AnyDesk.app..."

          ANYDESK_APP=$(find "$MOUNT" \
            -maxdepth 3 \
            -type d \
            -name "AnyDesk.app" \
            -print -quit)

          if [ -z "$ANYDESK_APP" ]; then
            echo "ERROR: AnyDesk.app was not found."
            echo ""
            echo "DMG contents:"
            find "$MOUNT" -maxdepth 3 -print
            exit 1
          fi

          echo "Found:"
          echo "$ANYDESK_APP"

          echo ""
          echo "Installing AnyDesk..."

          sudo rm -rf "/Applications/AnyDesk.app"

          sudo cp -R \
            "$ANYDESK_APP" \
            "/Applications/AnyDesk.app"

          echo ""
          echo "AnyDesk installed."

          ls -ld "/Applications/AnyDesk.app"

      # ==================================================
      # UNMOUNT DMG
      # ==================================================

      - name: Unmount AnyDesk DMG
        shell: bash
        run: |
          set -euo pipefail

          MOUNT="$RUNNER_TEMP/anydesk"

          echo "Unmounting DMG..."

          hdiutil detach "$MOUNT" -force || true

          rm -f "$RUNNER_TEMP/AnyDesk.dmg"
          rm -f "$RUNNER_TEMP/AnyDesk.download"

          echo "Cleanup complete."

      # ==================================================
      # START ANYDESK
      # ==================================================

      - name: Start AnyDesk
        shell: bash
        run: |
          set -euo pipefail

          APP="/Applications/AnyDesk.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: AnyDesk.app is missing."
            exit 1
          fi

          echo "Starting AnyDesk..."

          open -a "$APP"

          sleep 10

      # ==================================================
      # CONFIGURE PASSWORD
      # ==================================================

      - name: Configure AnyDesk Password
        shell: bash
        run: |
          set -euo pipefail

          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          if [ ! -x "$ANYDESK" ]; then
            echo "ERROR: AnyDesk executable not found."
            exit 1
          fi

          echo "Setting unattended-access password..."

          printf '%s\n' "$ANYDESK_PASS" | \
            sudo "$ANYDESK" --set-password

          echo "Password configuration completed."

          sleep 5

      # ==================================================
      # RESTART ANYDESK
      # ==================================================

      - name: Restart AnyDesk
        shell: bash
        run: |
          echo "Restarting AnyDesk..."

          pkill -f "/Applications/AnyDesk.app" || true

          sleep 5

          open -a "/Applications/AnyDesk.app"

          sleep 10

      # ==================================================
      # GET ANYDESK ID
      # ==================================================

      - name: Get AnyDesk ID
        shell: bash
        run: |
          set -euo pipefail

          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          ID=""

          echo "Waiting for AnyDesk ID..."

          for i in {1..20}; do

            ID=$("$ANYDESK" --get-id 2>/dev/null || true)

            if [ -n "$ID" ]; then
              break
            fi

            echo "Attempt $i/20..."
            sleep 4

          done

          echo ""
          echo "===================================================="
          echo "          ANYDESK MACOS MACHINE READY"
          echo "===================================================="
          echo ""
          echo " CONNECTION ID : $ID"
          echo " PASSWORD      : $ANYDESK_PASS"
          echo ""
          echo "===================================================="
          echo ""

          if [ -z "$ID" ]; then
            echo "WARNING: AnyDesk ID could not be retrieved."
          fi

      # ==================================================
      # MACHINE INFORMATION
      # ==================================================

      - name: Display Machine Information
        shell: bash
        run: |
          echo ""
          echo "================ MACHINE INFO ================"

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "CPU cores:"
          sysctl -n hw.logicalcpu

          echo ""
          echo "Memory:"
          sysctl -n hw.memsize

          echo ""
          echo "=============================================="

      # ==================================================
      # INSTALL OPERA GX
      # ==================================================

      - name: Install Opera GX
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Opera GX..."

          brew install --cask opera-gx

          echo "Opera GX installed."

      # ==================================================
      # OPEN ROBLOX CREATOR
      # ==================================================

      - name: Open Roblox Creator
        shell: bash
        run: |
          echo "Opening Roblox Creator..."

          open -a "Opera GX" \
            "https://create.roblox.com/landing"

          sleep 10

      # ==================================================
      # KEEP ALIVE
      # ==================================================

      - name: Keep Alive
        shell: bash
        run: |
          set -euo pipefail

          MINUTES="$RUNTIME_MINUTES"

          START=$(date +%s)
          END=$((START + MINUTES * 60))

          echo ""
          echo "===================================================="
          echo "              MACOS RUNNER ACTIVE"
          echo "===================================================="
          echo ""
          echo "Runtime: $MINUTES minutes"
          echo ""

          while true; do

            NOW=$(date +%s)

            if [ "$NOW" -ge "$END" ]; then
              break
            fi

            REMAINING=$((END - NOW))

            echo "Cloud Mac Heartbeat: $(date '+%H:%M:%S') | Remaining: ${REMAINING}s"

            sleep 60

          done

          echo ""
          echo "Runtime finished."