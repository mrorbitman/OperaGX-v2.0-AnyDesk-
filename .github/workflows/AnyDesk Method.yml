name: AnyDesk macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-mac:
    runs-on: macos-14
    timeout-minutes: 360

    env:
      ANYDESK_PASS: "Pass@4321"
      RUNTIME_MINUTES: 350

    steps:

      - name: Clean Desktop
        shell: bash
        run: |
          echo "Cleaning unnecessary desktop shortcuts..."

          rm -f "$HOME/Desktop/Unity Hub.app"
          rm -f "$HOME/Desktop/Firefox.app"
          rm -f "$HOME/Desktop/Google Chrome.app"

      - name: Download AnyDesk
        shell: bash
        run: |
          set -e

          echo "Downloading AnyDesk..."

          curl -fL \
            "https://download.anydesk.com/anydesk.dmg" \
            -o "$RUNNER_TEMP/anydesk.dmg"

          if [ ! -s "$RUNNER_TEMP/anydesk.dmg" ]; then
            echo "AnyDesk DMG download failed."
            exit 1
          fi

          echo "DMG downloaded successfully."

      - name: Mount AnyDesk DMG
        shell: bash
        run: |
          set -e

          echo "Mounting AnyDesk DMG..."

          mkdir -p "$RUNNER_TEMP/anydesk"

          hdiutil attach \
            "$RUNNER_TEMP/anydesk.dmg" \
            -nobrowse \
            -readonly \
            -mountpoint "$RUNNER_TEMP/anydesk"

          echo "Mounted contents:"
          ls -la "$RUNNER_TEMP/anydesk"

      - name: Install AnyDesk
        shell: bash
        run: |
          set -e

          echo "Installing AnyDesk..."

          if [ ! -d "$RUNNER_TEMP/anydesk/AnyDesk.app" ]; then
            echo "AnyDesk.app was not found."
            exit 1
          fi

          rm -rf "/Applications/AnyDesk.app"

          sudo cp -R \
            "$RUNNER_TEMP/anydesk/AnyDesk.app" \
            "/Applications/AnyDesk.app"

          echo "AnyDesk.app copied to Applications."

          hdiutil detach "$RUNNER_TEMP/anydesk" || true

          rm -f "$RUNNER_TEMP/anydesk.dmg"

      - name: Launch AnyDesk
        shell: bash
        run: |
          set -e

          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          if [ ! -f "$ANYDESK" ]; then
            echo "AnyDesk executable not found."
            exit 1
          fi

          echo "Launching AnyDesk..."

          open -a "/Applications/AnyDesk.app"

          echo "Giving AnyDesk time to initialize..."

          sleep 30

          echo "AnyDesk processes:"

          pgrep -alf "AnyDesk" || true

      - name: Check AnyDesk Status
        shell: bash
        run: |
          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          echo "Checking AnyDesk version..."
          "$ANYDESK" --version || true

          echo ""
          echo "Checking AnyDesk ID..."

          ID=""

          for i in {1..20}; do
            ID=$("$ANYDESK" --get-id 2>/dev/null || true)

            if [ -n "$ID" ]; then
              echo "AnyDesk ID detected: $ID"
              break
            fi

            echo "Waiting for AnyDesk... $i/20"
            sleep 5
          done

          if [ -z "$ID" ]; then
            echo "WARNING: AnyDesk ID was not available."
          fi

      - name: Configure AnyDesk Password
        shell: bash
        run: |
          set -e

          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          echo "Configuring unattended access..."

          if ! printf '%s\n' "$ANYDESK_PASS" | \
            sudo "$ANYDESK" --set-password; then

            echo ""
            echo "AnyDesk could not configure the password."
            echo "The AnyDesk Service may not be installed/running."
            echo ""

          else
            echo "AnyDesk password configured successfully."
          fi

      - name: Get AnyDesk ID
        shell: bash
        run: |
          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          echo "Waiting for AnyDesk ID..."

          ID=""

          for i in {1..30}; do
            ID=$("$ANYDESK" --get-id 2>/dev/null || true)

            if [ -n "$ID" ]; then
              break
            fi

            sleep 4
          done

          echo ""
          echo "===================================================="
          echo "             ANYDESK MAC CLOUD MACHINE"
          echo "===================================================="

          if [ -n "$ID" ]; then
            echo " CONNECTION ID : $ID"
          else
            echo " CONNECTION ID : unavailable"
          fi

          echo " PASSWORD      : $ANYDESK_PASS"

          echo "===================================================="
          echo ""

      - name: Show Machine Information
        shell: bash
        run: |
          echo ""
          echo "================ MACHINE INFO ================"

          echo "macOS:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "CPU:"
          sysctl -n hw.logicalcpu

          echo ""
          echo "Memory:"
          sysctl -n hw.memsize

          echo ""
          echo "=============================================="

      - name: Keep Alive
        shell: bash
        run: |
          MINUTES="$RUNTIME_MINUTES"

          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + MINUTES * 60))

          echo "Cloud Mac started:"
          date

          echo "Runtime: ${MINUTES} minutes"

          while true; do
            CURRENT_TIME=$(date +%s)

            if [ "$CURRENT_TIME" -ge "$END_TIME" ]; then
              break
            fi

            REMAINING=$((END_TIME - CURRENT_TIME))
            REMAINING_MIN=$((REMAINING / 60))

            echo "Cloud Mac Heartbeat: $(date) | ${REMAINING_MIN} minutes remaining"

            sleep 60
          done

          echo "Runtime finished."