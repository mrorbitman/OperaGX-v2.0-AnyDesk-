name: AnyDesk macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-mac:
    runs-on: macos-14
    timeout-minutes: 360

    env:
      ANYDESK_PASS: "Pass@4321"
      RUNTIME_MINUTES: 350

    steps:

      - name: Clean Desktop
        shell: bash
        run: |
          echo "Cleaning unnecessary desktop  shortcuts..."

          rm -f "$HOME/Desktop/Unity Hub.app"
          rm -f "$HOME/Desktop/Firefox.app"
          rm -f "$HOME/Desktop/Google Chrome.app"

                 - name: Download AnyDesk
        shell: bash
        run: |
          set -euo pipefail

          COMPRESSED="$RUNNER_TEMP/AnyDesk.download"
          DMG="$RUNNER_TEMP/AnyDesk.dmg"

          echo "Downloading AnyDesk..."

          curl -fL \
            --retry 3 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "https://anydesk.com/en/downloads/thank-you?dv=mac_dmg" \
            -o "$COMPRESSED"

          echo "Downloaded:"
          ls -lh "$COMPRESSED"

          echo "Decompressing AnyDesk..."

          python3 - "$COMPRESSED" "$DMG" <<'PY'
import sys
import zlib

src = sys.argv[1]
dst = sys.argv[2]

with open(src, "rb") as f:
    data = f.read()

decompressor = zlib.decompressobj()
output = decompressor.decompress(data)

if not decompressor.eof:
    raise RuntimeError("The AnyDesk download did not contain a complete zlib stream.")

with open(dst, "wb") as f:
    f.write(output)

print(f"Decompressed {len(data):,} bytes -> {len(output):,} bytes")
PY

          echo "Checking DMG..."

          file "$DMG"
          ls -lh "$DMG"

      - name: Mount AnyDesk
        shell: bash
        run: |
          set -euo pipefail

          DMG="$RUNNER_TEMP/AnyDesk.dmg"
          MOUNT="$RUNNER_TEMP/anydesk"

          mkdir -p "$MOUNT"

          echo "Mounting AnyDesk..."

          hdiutil attach "$DMG" \
            -nobrowse \
            -readonly \
            -mountpoint "$MOUNT"

          echo "Mounted successfully."

          ls -la "$MOUNT"

      - name: Install AnyDesk
        shell: bash
        run: |
          set -e

          echo "Installing AnyDesk..."

          if [ -d "$RUNNER_TEMP/anydesk/AnyDesk.app" ]; then
            sudo cp -R \
              "$RUNNER_TEMP/anydesk/AnyDesk.app" \
              "/Applications/AnyDesk.app"
          else
            echo "AnyDesk.app was not found in the mounted image."
            exit 1
          fi

          hdiutil detach "$RUNNER_TEMP/anydesk" || true

          rm -f "$RUNNER_TEMP/AnyDesk.dmg"

          echo "AnyDesk installed."

      - name: Configure AnyDesk
        shell: bash
        run: |
          set -e

          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          if [ ! -f "$ANYDESK" ]; then
            echo "AnyDesk executable not found."
            exit 1
          fi

          echo "Starting AnyDesk..."
          open -a "/Applications/AnyDesk.app"

          sleep 8

          echo "Configuring unattended access..."

          echo "$ANYDESK_PASS" | \
            sudo "$ANYDESK" --set-password

          echo "Restarting AnyDesk..."

          sudo pkill -f AnyDesk || true
          sleep 3

          open -a "/Applications/AnyDesk.app"

          sleep 8

      - name: Grant macOS Remote Permissions
        shell: bash
        run: |
          echo "Checking macOS permissions..."

          echo ""
          echo "IMPORTANT:"
          echo "macOS may require Screen Recording and Accessibility"
          echo "permissions for AnyDesk."
          echo ""

          # GitHub-hosted macOS runners may not allow these
          # permissions to be granted automatically.
          #
          # AnyDesk itself may therefore connect with limited
          # interaction depending on the runner image.

      - name: Get AnyDesk ID
        shell: bash
        run: |
          set -e

          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          echo "Waiting for AnyDesk ID..."

          ID=""

          for i in {1..15}; do
            ID=$("$ANYDESK" --get-id 2>/dev/null || true)

            if [ -n "$ID" ]; then
              break
            fi

            sleep 4
          done

          echo ""
          echo "===================================================="
          echo "          ANYDESK MAC CLOUD MACHINE READY"
          echo "===================================================="
          echo " CONNECTION ID : $ID"
          echo " PASSWORD      : $ANYDESK_PASS"
          echo "===================================================="
          echo ""

          if [ -z "$ID" ]; then
            echo "WARNING: AnyDesk ID could not be detected."
          fi

      - name: Install Opera GX
        shell: bash
        run: |
          set -e

          echo "Installing Opera GX..."

          brew install --cask opera-gx || true

          echo "Opera GX installation complete."

      - name: Launch Roblox Creator
        shell: bash
        run: |
          echo "Launching Roblox Creator..."

          open -a "Opera GX" \
            "https://create.roblox.com/landing"

          sleep 5

      - name: Show Machine Information
        shell: bash
        run: |
          echo ""
          echo "================ MACHINE INFO ================"

          echo "macOS:"
          sw_vers

          echo ""
          echo "CPU:"
          sysctl -n hw.logicalcpu

          echo ""
          echo "Memory:"
          sysctl -n hw.memsize

          echo ""
          echo "=============================================="

      - name: Keep Alive
        shell: bash
        run: |
          MINUTES="$RUNTIME_MINUTES"

          END_TIME=$(date -v+"${MINUTES}"M)

          echo "Cloud Mac will remain active until:"
          echo "$END_TIME"

          while true; do
            NOW=$(date)

            echo "Cloud Mac Heartbeat: $NOW"

            if [[ "$OSTYPE" == "darwin"* ]]; then
              CURRENT=$(date +%s)
              END=$(date -j -f "%a %b %d %T %Z %Y" \
                "$END_TIME" +%s 2>/dev/null || echo 0)

              if [ "$END" -ne 0 ] && [ "$CURRENT" -ge "$END" ]; then
                break
              fi
            fi

            sleep 60
          done

          echo "Runtime finished."