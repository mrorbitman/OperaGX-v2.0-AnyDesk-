name: TurboVNC Desktop for AVNC App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vnc-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VNC_PASS: Pass@4321
      RUNTIME_MINUTES: 350

    steps:
      - name: Create 4GB Swap Space
        run: |
          sudo fallocate -l 4G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=4096
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2

      - name: Update System & Install XFCE4 + TurboVNC + SSH
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xfce4 \
            xfce4-terminal \
            arc-theme \
            papirus-icon-theme \
            fonts-firacode \
            dbus-x11 \
            xauth \
            wget \
            curl \
            openssh-client

          # Install TurboVNC directly
          TURBOVNC_VER="3.1.1"
          wget "https://github.com/TurboVNC/turbovnc/releases/download/${TURBOVNC_VER}/turbovnc_${TURBOVNC_VER}_amd64.deb" -O turbovnc.deb
          sudo dpkg -i turbovnc.deb || sudo apt-get install -f -y
          rm turbovnc.deb

      - name: Configure VNC Password & Themes
        run: |
          mkdir -p ~/.vnc ~/.config/xfce4/xfconf/xfce-perchannel-xml
          touch ~/.Xauthority
          
          # Set VNC password
          /opt/TurboVNC/bin/vncpasswd -f <<< "${{ env.VNC_PASS }}" > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # Themes
          cat << 'EOF' > ~/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xsettings" version="1.0">
            <property name="Net" type="empty">
              <property name="ThemeName" type="string" value="Arc-Dark"/>
              <property name="IconThemeName" type="string" value="Papirus-Dark"/>
            </property>
          </channel>
          EOF

          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_SESSION_TYPE=x11
          export GDK_BACKEND=x11
          export LIBGL_ALWAYS_SOFTWARE=1
          
          dbus-launch startxfce4 &
          EOF
          chmod +x ~/.vnc/xstartup

      - name: Start TurboVNC Server on display :1 (TCP Port 5901)
        run: |
          /opt/TurboVNC/bin/vncserver :1 -geometry 1280x720 -depth 24 -securitytypes VNC -rfbauth ~/.vnc/passwd

      - name: Start Pinggy TCP Tunnel & Display AVNC Details
        run: |
          # Forward raw TCP Port 5901 using Pinggy SSH
          ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:5901 tcp@a.pinggy.io > /tmp/pinggy.log 2>&1 &
          sleep 6

          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          RED='\033[0;31m'
          RESET='\033[0m'

          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${GREEN}        AVNC / VNC APP CONNECTION DETAILS           ${RESET}"
          echo -e "${GREEN}====================================================${RESET}"
          
          cat /tmp/pinggy.log
          
          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${YELLOW} VNC PASSWORD : ${RED}${{ env.VNC_PASS }}${RESET}"
          echo -e "${GREEN}====================================================${RESET}"

      - name: Keep alive
        run: |
          MINS="${{ env.RUNTIME_MINUTES }}"
          END_TIME=$(($(date +%s) + MINS * 60))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "Cloud PC Heartbeat $(date +'%H:%M:%S') | Active AVNC TCP session running..."
            sleep 60
          done
