name: GNOME VNC via ngrok

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vnc-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VNC_PASS: Pass@4321
      RUNTIME_MINUTES: 350

    steps:
      - name: Create 4GB Swap Space (Prevents OOM Kills)
        run: |
          sudo fallocate -l 4G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=4096
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2

      - name: Update System & Install GNOME Desktop + VNC
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ubuntu-desktop-minimal \
            gnome-shell \
            gnome-session-flashback \
            tightvncserver \
            dbus-x11 \
            xauth \
            wget \
            curl

      - name: Install & Configure ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -y
          sudo apt-get install -y ngrok
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Configure VNC Password & xstartup Script
        run: |
          mkdir -p ~/.vnc
          
          # Set VNC password
          echo "${{ env.VNC_PASS }}" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # Configure VNC startup script to launch GNOME Flashback
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_SESSION_TYPE=x11
          export GDK_BACKEND=x11
          export LIBGL_ALWAYS_SOFTWARE=1
          
          dbus-launch gnome-session --session=gnome-flashback &
          EOF
          chmod +x ~/.vnc/xstartup

      - name: Start VNC Server
        run: |
          # Start VNC server on display :1 (port 5901)
          vncserver :1 -geometry 1920x1080 -depth 24

      - name: Launch Default Browser inside VNC
        run: |
          export DISPLAY=:1
          x-www-browser https://create.roblox.com/landing > /dev/null 2>&1 &
          sleep 3

      - name: Start ngrok Tunnel & Print Connection Info
        run: |
          # Tunnel TCP port 5901 (VNC port) via ngrok
          ngrok tcp 5901 > /dev/null 2>&1 &
          sleep 5
          
          # Fetch public tunnel URL from ngrok local API
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | grep -oP 'tcp://\K[^"]+')

          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          RED='\033[0;31m'
          RESET='\033[0m'

          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${GREEN}          GNOME VNC SERVER IS READY TO CONNECT       ${RESET}"
          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${YELLOW} VNC ADDRESS  : ${RED}${NGROK_URL}${RESET}"
          echo -e "${YELLOW} VNC PASSWORD : ${RED}${{ env.VNC_PASS }}${RESET}"
          echo -e "${GREEN}====================================================${RESET}"

      - name: Keep alive
        run: |
          MINS="${{ env.RUNTIME_MINUTES }}"
          END_TIME=$(($(date +%s) + MINS * 60))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "Cloud PC Heartbeat $(date +'%H:%M:%S') | Active GNOME VNC session running..."
            sleep 60
          done
