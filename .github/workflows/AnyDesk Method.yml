name: Minimal XFCE4 TurboVNC via Bore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vnc-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VNC_PASS: Pass@4321
      RUNTIME_MINUTES: 350

    steps:
      - name: Create 4GB Swap Space (Prevents OOM Kills)
        run: |
          sudo fallocate -l 4G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=4096
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2

      - name: Update System & Install XFCE4 + TurboVNC Engine
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xfce4 \
            xfce4-terminal \
            arc-theme \
            papirus-icon-theme \
            fonts-firacode \
            dbus-x11 \
            xauth \
            wget \
            curl

          # Download TurboVNC directly from GitHub Releases
          TURBOVNC_VER="3.1.1"
          wget "https://github.com/TurboVNC/turbovnc/releases/download/${TURBOVNC_VER}/turbovnc_${TURBOVNC_VER}_amd64.deb" -O turbovnc.deb
          sudo dpkg -i turbovnc.deb || sudo apt-get install -f -y
          rm turbovnc.deb

          # Download Bore TCP Tunnel binary
          wget https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/
          rm bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz

      - name: Configure VNC Password, Minimal Themes, Animations & xstartup
        run: |
          mkdir -p ~/.vnc ~/.config/xfce4/xfconf/xfce-perchannel-xml
          touch ~/.Xauthority
          
          # Set VNC password using TurboVNC binary
          /opt/TurboVNC/bin/vncpasswd -f <<< "${{ env.VNC_PASS }}" > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # 1. Apply Arc-Dark Theme & Papirus Dark Icons
          cat << 'EOF' > ~/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xsettings" version="1.0">
            <property name="Net" type="empty">
              <property name="ThemeName" type="string" value="Arc-Dark"/>
              <property name="IconThemeName" type="string" value="Papirus-Dark"/>
            </property>
            <property name="Gtk" type="empty">
              <property name="FontName" type="string" value="Fira Code 10"/>
              <property name="MonospaceFontName" type="string" value="Fira Code 10"/>
            </property>
          </channel>
          EOF

          # 2. Configure Window Manager Theme + Enable Compositor Animations & Shadows
          cat << 'EOF' > ~/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfwm4" version="1.0">
            <property name="general" type="empty">
              <property name="theme" type="string" value="Arc-Dark"/>
              <property name="use_compositing" type="bool" value="true"/>
              <property name="show_dock_shadows" type="bool" value="true"/>
              <property name="show_frame_shadows" type="bool" value="true"/>
              <property name="show_popup_shadows" type="bool" value="true"/>
              <property name="snap_to_border" type="bool" value="true"/>
              <property name="tile_on_move" type="bool" value="true"/>
            </property>
          </channel>
          EOF

          # 3. Configure TurboVNC startup script
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_SESSION_TYPE=x11
          export GDK_BACKEND=x11
          export LIBGL_ALWAYS_SOFTWARE=1
          
          dbus-launch startxfce4 &
          EOF
          chmod +x ~/.vnc/xstartup

      - name: Start TurboVNC Server
        run: |
          /opt/TurboVNC/bin/vncserver :1 -geometry 1920x1080 -depth 24 -securitytypes VNC -rfbauth ~/.vnc/passwd

      - name: Launch Default Browser inside VNC
        run: |
          export DISPLAY=:1
          x-www-browser https://create.roblox.com/landing > /dev/null 2>&1 &
          sleep 3

      - name: Start Bore TCP Tunnel & Display URL
        run: |
          # Forward VNC local port 5901 to bore.pub
          bore local 5901 --to bore.pub > /tmp/bore.log 2>&1 &
          sleep 5

          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          RED='\033[0;31m'
          RESET='\033[0m'

          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${GREEN}      TURBOVNC (60 FPS) READY OVER BORE TUNNEL       ${RESET}"
          echo -e "${GREEN}====================================================${RESET}"
          
          # Print the line showing bore.pub port assignment
          cat /tmp/bore.log | grep -E "listening|bound|listening at" || cat /tmp/bore.log
          
          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${YELLOW} VNC PASSWORD : ${RED}${{ env.VNC_PASS }}${RESET}"
          echo -e "${GREEN}====================================================${RESET}"

      - name: Keep alive
        run: |
          MINS="${{ env.RUNTIME_MINUTES }}"
          END_TIME=$(($(date +%s) + MINS * 60))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "Cloud PC Heartbeat $(date +'%H:%M:%S') | Active TurboVNC session running..."
            sleep 60
          done